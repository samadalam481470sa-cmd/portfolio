stages:
  - test
  - deploy

test:
  image: python:3.12-slim
  stage: test
  script:
    - PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 -m unittest discover -s tests

pages:
  image: alpine:3.20
  stage: deploy
  script:
    - mkdir public
    - cp -R web/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
