[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "estateiq"
version = "0.1.0"
description = "Real estate intelligence platform foundation for collecting, scoring, and tracking investment opportunities."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EstateIQ Contributors" }]
dependencies = []

[project.scripts]
estateiq-api = "estateiq.api:main"
estateiq-seed = "estateiq.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
