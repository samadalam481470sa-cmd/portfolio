[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearmesh"
version = "0.1.0"
description = "Clearmesh: compliance-gated BFT settlement ledger for synthetic interbank payments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Clearmesh Contributors" }]
dependencies = [
  "cbor2>=5.6",
  "pynacl>=1.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "typer>=0.12",
  "rich>=13.9",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "rapidfuzz>=3.10",
  "Unidecode>=1.3",
  "Faker>=30.0",
  "lxml>=5.3",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "coverage[toml]>=7.6",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-lxml",
]

[project.scripts]
clearmesh = "tools.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["clearmesh*", "tools*", "sim*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["samples", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["clearmesh", "tools", "sim"]
exclude = ["tests/", "samples/", "deploy/"]

[[tool.mypy.overrides]]
module = ["nacl.*", "cbor2.*", "rapidfuzz.*", "unidecode.*", "faker.*", "lxml.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["clearmesh"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
