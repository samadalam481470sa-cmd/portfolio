services:
  clearmesh-solo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["bash", "-lc", "clearmesh testnet --out /data/testnet && clearmesh node start --config /data/testnet/node.toml --password testnet"]
    ports:
      - "26657:26657"
    volumes:
      - clearmesh-data:/data
  explorer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "tools.explorer.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    depends_on:
      - clearmesh-solo
volumes:
  clearmesh-data:
