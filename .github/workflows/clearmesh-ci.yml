name: clearmesh-ci
on:
  push:
    paths:
      - "clearmesh/**"
      - ".github/workflows/clearmesh-ci.yml"
  pull_request:
    paths:
      - "clearmesh/**"
      - ".github/workflows/clearmesh-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearmesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Determinism lint
        run: python tools/lint_determinism.py
      - name: Pytest
        run: pytest -q --tb=short
