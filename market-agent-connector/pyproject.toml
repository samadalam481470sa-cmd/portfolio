[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-agent-connector"
version = "0.3.0"
description = "AI trading connector with Telegram/Discord bots for Polymarket, Kalshi, Robinhood"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.6.0,<2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-telegram-bot>=21.0",
    "discord.py>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
market-agent-mcp = "market_agent.server:main"
market-agent-api = "market_agent.api:main"
market-agent-growth = "market_agent.growth.daemon:main"
market-agent-bot = "market_agent.bots.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
